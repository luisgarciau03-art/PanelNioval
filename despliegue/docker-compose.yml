# Plantilla versionada. La copia VIVA está en /srv/panel/docker-compose.yml
# del servidor 155.138.200.66 y apunta a ./app (el clon de este repo).
services:
  panel:
    build: ./app
    container_name: panel          # Caddy resuelve este nombre en reverse_proxy panel:8000
    restart: unless-stopped
    environment:
      - GOOGLE_CREDENTIALS_FILE=/app/credentials.json
    env_file:
      - ./secretos/.env
    volumes:
      - ./secretos/credentials.json:/app/credentials.json:ro
    # Healthcheck tambien aqui, no solo en el Dockerfile: la copia VIVA de este
    # compose es la que manda en el VPS, y `docker compose ps` lee esta.
    # Mismo motivo que alli para usar python y no curl: la imagen no trae curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    mem_limit: 768m
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
